name: Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pip install -e .
          pyinstaller --onefile --windowed --name "UT99-BSP-Extractor" --add-data "src/ut99bsp:ut99bsp" ut99_bsp_gui.py

      - name: Rename binary per platform
        run: |
          case "${{ runner.os }}" in
            Linux)   mv dist/UT99-BSP-Extractor dist/UT99-BSP-Extractor-linux    ;;
            Windows) mv dist/UT99-BSP-Extractor.exe dist/UT99-BSP-Extractor-windows.exe ;;
            macOS)   mv dist/UT99-BSP-Extractor dist/UT99-BSP-Extractor-macos    ;;
          esac

      - name: Package Linux zip
        if: runner.os == 'Linux'
        run: |
          cd dist
          echo "See README.txt in the project root for install instructions" > README.txt
          zip -j UT99-BSP-Extractor-Linux.zip UT99-BSP-Extractor-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UT99-BSP-Extractor-${{ runner.os }}
          path: dist/UT99-BSP-Extractor-*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: UT99-BSP-Extractor-*
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh
          gh release upload "${GITHUB_REF_NAME}" UT99-BSP-Extractor-* --clobber
