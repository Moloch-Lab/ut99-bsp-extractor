name: Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pip install -e .
          pyinstaller --onefile --windowed --name "UT99-BSP-Extractor" --add-data "src/ut99bsp:ut99bsp" ut99_bsp_gui.py

      - name: Rename binary per platform
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   mv dist/UT99-BSP-Extractor dist/UT99-BSP-Extractor-linux    ;;
            Windows) mv dist/UT99-BSP-Extractor.exe dist/UT99-BSP-Extractor-windows.exe ;;
            macOS)   mv dist/UT99-BSP-Extractor dist/UT99-BSP-Extractor-macos    ;;
          esac

      - name: Build distro packages (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist

          # .deb
          mkdir -p "deb_pkg/ut99-bsp-extractor_${VERSION}_amd64/DEBIAN"
          mkdir -p "deb_pkg/ut99-bsp-extractor_${VERSION}_amd64/usr/bin"
          cp UT99-BSP-Extractor-linux "deb_pkg/ut99-bsp-extractor_${VERSION}_amd64/usr/bin/ut99-bsp-extractor"
          printf 'Package: ut99-bsp-extractor\nVersion: %s\nArchitecture: amd64\nMaintainer: Moloch Lab\nDescription: Extract BSP geometry from UT99 .unr map files\n GUI and CLI tool for exporting to OBJ/MTL and glTF formats.\n' \
            "$VERSION" > "deb_pkg/ut99-bsp-extractor_${VERSION}_amd64/DEBIAN/control"
          dpkg-deb --build "deb_pkg/ut99-bsp-extractor_${VERSION}_amd64"
          mv "deb_pkg/ut99-bsp-extractor_${VERSION}_amd64.deb" .

          # .rpm
          sudo apt-get install -y -qq rpm 2>/dev/null || true
          mkdir -p ~/rpmbuild/{SOURCES,SPECS,BUILD}
          cp UT99-BSP-Extractor-linux ~/rpmbuild/SOURCES/ut99-bsp-extractor
          printf 'Name: ut99-bsp-extractor\nVersion: %s\nRelease: 1\nSummary: UT99 BSP geometry extractor\nLicense: MIT\nBuildArch: x86_64\n%%description\nExtract BSP geometry from Unreal Tournament 99 .unr files.\n%%install\nmkdir -p %%{buildroot}/usr/bin\ninstall -m 755 %%{_sourcedir}/ut99-bsp-extractor %%{buildroot}/usr/bin/\n%%files\n/usr/bin/ut99-bsp-extractor\n' \
            "$VERSION" > ~/rpmbuild/SPECS/ut99-bsp-extractor.spec
          rpmbuild -bb ~/rpmbuild/SPECS/ut99-bsp-extractor.spec 2>/dev/null || true
          cp ~/rpmbuild/RPMS/x86_64/ut99-bsp-extractor-${VERSION}-1.x86_64.rpm . 2>/dev/null || true

          # AppImage
          APPDIR=UT99-BSP-Extractor.AppDir
          mkdir -p "${APPDIR}/usr/bin"
          cp UT99-BSP-Extractor-linux "${APPDIR}/usr/bin/ut99-bsp-extractor"
          printf '[Desktop Entry]\nName=UT99 BSP Extractor\nExec=ut99-bsp-extractor\nType=Application\nCategories=Graphics;3DGraphics;\n' \
            > "${APPDIR}/ut99-bsp-extractor.desktop"
          printf '#!/bin/bash\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/ut99-bsp-extractor" "$@"\n' \
            > "${APPDIR}/AppRun"
          chmod +x "${APPDIR}/AppRun"

          curl -sSL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          ./appimagetool "${APPDIR}" UT99-BSP-Extractor-x86_64.AppImage 2>/dev/null || true

          ls -lh *.deb *.rpm *.AppImage 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UT99-BSP-Extractor-${{ runner.os }}
          path: |
            dist/UT99-BSP-Extractor-*
            dist/*.deb
            dist/*.rpm

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: UT99-BSP-Extractor-*
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh
          # Create release if it doesn't exist yet
          gh release view "${GITHUB_REF_NAME}" &>/dev/null || \
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          # Upload whatever artifacts exist (some may not have built)
          for f in UT99-BSP-Extractor-* *.deb *.rpm; do
            [ -f "$f" ] && gh release upload "${GITHUB_REF_NAME}" "$f" --clobber
          done
