name: Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pip install -e .
          pyinstaller --onefile --windowed --name "UT99-BSP-Extractor" --add-data "src/ut99bsp:ut99bsp" ut99_bsp_gui.py

      - name: Rename binary per platform
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   mv dist/UT99-BSP-Extractor dist/UT99-BSP-Extractor-linux    ;;
            Windows) mv dist/UT99-BSP-Extractor.exe dist/UT99-BSP-Extractor-windows.exe ;;
            macOS)   mv dist/UT99-BSP-Extractor dist/UT99-BSP-Extractor-macos    ;;
          esac

      - name: Package Linux zip
        if: runner.os == 'Linux'
        run: |
          cd dist
          echo "See README.txt in the project root for install instructions" > README.txt
          zip -j UT99-BSP-Extractor-Linux.zip UT99-BSP-Extractor-linux

      - name: Build distro packages (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist

          # .deb
          mkdir -p deb_pkg/ut99-bsp-extractor_${VERSION}_amd64/DEBIAN
          mkdir -p deb_pkg/ut99-bsp-extractor_${VERSION}_amd64/usr/bin
          cp UT99-BSP-Extractor-linux deb_pkg/ut99-bsp-extractor_${VERSION}_amd64/usr/bin/ut99-bsp-extractor
          cat > deb_pkg/ut99-bsp-extractor_${VERSION}_amd64/DEBIAN/control << DEBIAN
Package: ut99-bsp-extractor
Version: ${VERSION}
Architecture: amd64
Maintainer: Moloch Lab
Description: Extract BSP geometry from UT99 .unr map files
 GUI and CLI tool for exporting to OBJ/MTL and glTF formats.
DEBIAN
          dpkg-deb --build deb_pkg/ut99-bsp-extractor_${VERSION}_amd64
          mv deb_pkg/ut99-bsp-extractor_${VERSION}_amd64.deb .

          # .rpm
          sudo apt-get install -y -qq rpm 2>/dev/null || true
          mkdir -p ~/rpmbuild/{SOURCES,SPECS,BUILD}
          cp UT99-BSP-Extractor-linux ~/rpmbuild/SOURCES/ut99-bsp-extractor
          cat > ~/rpmbuild/SPECS/ut99-bsp-extractor.spec << RPMSPEC
Name: ut99-bsp-extractor
Version: ${VERSION}
Release: 1
Summary: UT99 BSP geometry extractor
License: MIT
BuildArch: x86_64
%description
Extract BSP geometry from Unreal Tournament 99 .unr files.
%install
mkdir -p %{buildroot}/usr/bin
install -m 755 %{_sourcedir}/ut99-bsp-extractor %{buildroot}/usr/bin/
%files
/usr/bin/ut99-bsp-extractor
RPMSPEC
          rpmbuild -bb ~/rpmbuild/SPECS/ut99-bsp-extractor.spec 2>/dev/null || true
          cp ~/rpmbuild/RPMS/x86_64/ut99-bsp-extractor-${VERSION}-1.x86_64.rpm . 2>/dev/null || true

          # AppImage
          APPDIR=UT99-BSP-Extractor.AppDir
          mkdir -p ${APPDIR}/usr/bin
          cp UT99-BSP-Extractor-linux ${APPDIR}/usr/bin/ut99-bsp-extractor
          cat > ${APPDIR}/ut99-bsp-extractor.desktop << DESKTOP
[Desktop Entry]
Name=UT99 BSP Extractor
Exec=ut99-bsp-extractor
Type=Application
Categories=Graphics;3DGraphics;
DESKTOP
          cat > ${APPDIR}/AppRun << 'APPRUN'
#!/bin/bash
HERE="$(dirname "$(readlink -f "$0")")"
exec "$HERE/usr/bin/ut99-bsp-extractor" "$@"
APPRUN
          chmod +x ${APPDIR}/AppRun

          curl -sSL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          ./appimagetool ${APPDIR} UT99-BSP-Extractor-x86_64.AppImage 2>/dev/null || true

          ls -lh *.deb *.rpm *.AppImage 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UT99-BSP-Extractor-${{ runner.os }}
          path: |
            dist/UT99-BSP-Extractor-*
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: UT99-BSP-Extractor-*
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh
          gh release upload "${GITHUB_REF_NAME}" UT99-BSP-Extractor-* *.deb *.rpm *.AppImage --clobber
